name: Deploy to Cloudflare

# push 到 main 自动部署；也可手动 Run workflow。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch wrangler config (CI only, not committed)
        run: |
          node <<'NODE'
          const fs = require('fs');
          let s = fs.readFileSync('wrangler.jsonc', 'utf8');
          if (!s.includes('nodejs_compat')) {
            s = s.replace(/("compatibility_date": "[^"]+",)/,
              '$1\n  "compatibility_flags": ["nodejs_compat"],');
          }
          if (!s.includes('custom_domain')) {
            if (s.includes('"compatibility_flags"')) {
              s = s.replace(/("compatibility_flags": \[[^\]]*\],)/,
                '$1\n  "routes": [{ "pattern": "folia.annie813.de5.net", "custom_domain": true }],');
            } else {
              s = s.replace(/("compatibility_date": "[^"]+",)/,
                '$1\n  "routes": [{ "pattern": "folia.annie813.de5.net", "custom_domain": true }],');
            }
          }
          if (!s.includes('nodejs_compat') || !s.includes('custom_domain')) {
            console.error('wrangler.jsonc patch failed'); process.exit(1);
          }
          fs.writeFileSync('wrangler.jsonc', s);
          console.log('wrangler.jsonc patched for CI deploy');
          NODE

      - name: Build
        run: npx vite build
        env:
          VITE_QQ_API_BASE: /api/qq

      - name: Deploy
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
